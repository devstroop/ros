name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  NATIVE_SDK_TAG: v0.11.0
  NATIVE_ZIG_VERSION: "0.16.0"
  NODE_VERSION: "24"

jobs:
  verify:
    name: Tests and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Zig
        uses: vercel-labs/setup-zig@v1
        with:
          version: ${{ env.NATIVE_ZIG_VERSION }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore the Native SDK checkout
        id: sdk
        uses: actions/cache@v4
        with:
          path: ~/native-sdk
          key: native-sdk-${{ runner.os }}-${{ env.NATIVE_SDK_TAG }}-zig${{ env.NATIVE_ZIG_VERSION }}-b2
      - name: Fetch and build the SDK CLI
        if: steps.sdk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$NATIVE_SDK_TAG" https://github.com/vercel-labs/native.git "$HOME/native-sdk"
          cd "$HOME/native-sdk"
          zig build -Doptimize=ReleaseFast -Dcpu=baseline
      - name: Put the SDK CLI on PATH
        shell: bash
        run: |
          test -x "$HOME/native-sdk/zig-out/bin/native"
          echo "$HOME/native-sdk/zig-out/bin" >> "$GITHUB_PATH"
      - name: Install the SDK TypeScript toolchain
        shell: bash
        run: |
          set -euo pipefail
          cd "$HOME/native-sdk/packages/core"
          npm ci --include=dev
      - name: Point the app builds at the SDK
        shell: bash
        run: ln -sfn "$HOME/native-sdk" "$GITHUB_WORKSPACE/.native-sdk"
      - name: Cache the Zig compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: zig-cache-${{ runner.os }}-${{ env.NATIVE_SDK_TAG }}-zig${{ env.NATIVE_ZIG_VERSION }}
      - name: Run every app's tests and checks
        run: bash scripts/verify-all.sh

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Zig
        uses: vercel-labs/setup-zig@v1
        with:
          version: ${{ env.NATIVE_ZIG_VERSION }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install GTK (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - name: Restore the Native SDK checkout
        id: sdk
        uses: actions/cache@v4
        with:
          path: ~/native-sdk
          key: native-sdk-${{ runner.os }}-${{ env.NATIVE_SDK_TAG }}-zig${{ env.NATIVE_ZIG_VERSION }}-b2
      - name: Fetch and build the SDK CLI
        if: steps.sdk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$NATIVE_SDK_TAG" https://github.com/vercel-labs/native.git "$HOME/native-sdk"
          cd "$HOME/native-sdk"
          zig build -Doptimize=ReleaseFast -Dcpu=baseline
      - name: Put the SDK CLI on PATH
        shell: bash
        run: |
          test -x "$HOME/native-sdk/zig-out/bin/native"
          echo "$HOME/native-sdk/zig-out/bin" >> "$GITHUB_PATH"
      - name: Install the SDK TypeScript toolchain
        shell: bash
        run: |
          set -euo pipefail
          cd "$HOME/native-sdk/packages/core"
          npm ci --include=dev
      - name: Point the app builds at the SDK
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            rm -rf .native-sdk
            cp -r "$HOME/native-sdk" .native-sdk
            test -d .native-sdk
          else
            ln -sfn "$HOME/native-sdk" "$GITHUB_WORKSPACE/.native-sdk"
          fi
      - name: Cache the Zig compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: zig-cache-${{ runner.os }}-${{ env.NATIVE_SDK_TAG }}-zig${{ env.NATIVE_ZIG_VERSION }}
      - name: Build all apps
        shell: bash
        run: |
          set -euo pipefail
          for app in admin service kiosk; do
            echo "==> building $app"
            cd "apps/$app"
            native build --yes
            cd "$GITHUB_WORKSPACE"
          done
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ros-${{ matrix.os }}-build
          path: |
            apps/admin/zig-out/bin/ros-admin*
            apps/service/zig-out/bin/ros-service*
            apps/kiosk/zig-out/bin/ros-kiosk*
          if-no-files-found: error

  package-macos:
    name: Package (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Zig
        uses: vercel-labs/setup-zig@v1
        with:
          version: ${{ env.NATIVE_ZIG_VERSION }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore the Native SDK checkout
        id: sdk
        uses: actions/cache@v4
        with:
          path: ~/native-sdk
          key: native-sdk-${{ runner.os }}-${{ env.NATIVE_SDK_TAG }}-zig${{ env.NATIVE_ZIG_VERSION }}-b2
      - name: Fetch and build the SDK CLI
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$NATIVE_SDK_TAG" https://github.com/vercel-labs/native.git "$HOME/native-sdk"
          cd "$HOME/native-sdk"
          zig build -Doptimize=ReleaseFast -Dcpu=baseline
      - name: Put the SDK CLI on PATH
        run: |
          test -x "$HOME/native-sdk/zig-out/bin/native"
          echo "$HOME/native-sdk/zig-out/bin" >> "$GITHUB_PATH"
      - name: Install the SDK TypeScript toolchain
        run: |
          set -euo pipefail
          cd "$HOME/native-sdk/packages/core"
          npm ci --include=dev
      - name: Point the app builds at the SDK
        run: ln -sfn "$HOME/native-sdk" "$GITHUB_WORKSPACE/.native-sdk"
      - name: Cache the Zig compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: zig-cache-${{ runner.os }}-${{ env.NATIVE_SDK_TAG }}-zig${{ env.NATIVE_ZIG_VERSION }}
      - name: Package the three apps (Developer ID when configured)
        env:
          ROS_SIGNING_IDENTITY: ${{ secrets.ROS_SIGNING_IDENTITY }}
          ROS_NOTARY_PROFILE: ${{ secrets.ROS_NOTARY_PROFILE }}
        run: bash scripts/package.sh --ci
      - name: Verify the artifacts without rebuilding
        run: bash scripts/package.sh --check
      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: ros-macos-packages
          path: |
            dist/*.dmg
            dist/checksums.txt
          if-no-files-found: error

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify, build, package-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          files="$(find release-assets -type f)"
          gh release create "$tag" $files --title "$tag" --generate-notes
